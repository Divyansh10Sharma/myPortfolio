<script>
/* ============================================================
   Add a page by appending one object to this array. Do not
   restructure the file. Keys: title, kid, why, translation,
   code, tour, poke, breaks. Every value is an HTML string.

const PAGES = [

{
title: "Why there is a loop at all",

kid: `
<p>Think about a flipbook — the little books where you draw a stick man on every page,
then riffle the pages with your thumb and he runs.</p>
<p>Nothing in that book moves. Every page is a still drawing that will never change. The
running happens entirely in your eye, because the pages arrive faster than your brain can
keep them apart, so it gives up and merges them into one moving thing.</p>
<p>Your screen is a flipbook that redraws itself about sixty times every second. Not the
bits that changed — the whole picture, from scratch, sixty times a second, forever, even
when you are just staring at a still page and nothing at all is happening.</p>
<p>So when you want something on a screen to move, you never actually move it. You can't.
There is nothing there to push. What you do instead is answer one question, over and over,
sixty times a second: <em>"if I had to draw this right now, this instant, what would it
look like?"</em> Answer that fast enough and your eye does the rest.</p>
`,

why: `
<p>Every single thing on the site's wishlist — the scroll that glides, the grain, the
distortion, the cursor that reacts — is a different answer to that same question, given
sixty times a second. There is no second mechanism arriving in a later sprint.</p>
<p>Sprint 1 uses the loop for smooth scrolling and the headline reveal. Sprint 2 hands
the same loop to a shader. The loop is the machine; everything else is what we ask it.</p>
`,

translation: `
<table>
<tr><td>One page of the flipbook</td><td>a <strong>frame</strong></td></tr>
<tr><td>Riffling the pages</td><td>the <strong>render loop</strong> / <strong>ticker</strong></td></tr>
<tr><td>How many pages go by each second</td><td><strong>frame rate</strong>, measured in <strong>fps</strong></td></tr>
<tr><td>"What would this look like right now?"</td><td>the <strong>tick</strong> or update function</td></tr>
<tr><td>The clock on the wall while you flip</td><td><strong>elapsed time</strong></td></tr>
</table>
<p>Sixty frames per second means each frame gets <strong>16.6 milliseconds</strong> — that
is your entire budget to work out the new state and draw it. Go over, and you miss the
deadline: the screen shows the previous frame again and the motion visibly hitches. This
is what people mean by "dropping frames". It is a deadline, not a speed.</p>
`,

code: `
<p>The loop that drives this site is GSAP's ticker, and we add Lenis to it in
<span class="file">src/main.js</span>:</p>
<pre><code><span class="c">// One loop for the whole page, not two. GSAP already runs a</span>
<span class="c">// requestAnimationFrame ticker, so Lenis is driven from it rather</span>
<span class="c">// than starting a second loop competing for the same 16ms.</span>
gsap.ticker.add((time) =&gt; lenis.raf(time * 1000));
<span class="c">// GSAP counts in seconds, Lenis wants milliseconds — hence * 1000</span></code></pre>
<p>Written out by hand, with no library at all, the same idea is four lines:</p>
<pre><code>function tick() {
  requestAnimationFrame(tick);   <span class="c">// ask for the next page first</span>
  const now = performance.now(); <span class="c">// look at the clock</span>
  update(now);                   <span class="c">// what does this look like NOW?</span>
  draw();                        <span class="c">// tear the page off</span>
}
tick();</code></pre>
<p>Note the shape: the function's last real act is to ask to be called again. A render
loop is a function that keeps re-hiring itself.</p>
`,

tour: `
<p>The important line is the one asking for the next frame, and it comes <em>first</em> on
purpose. If the drawing work below it throws an error, the next frame has already been
requested, so the site limps rather than freezing solid.</p>
<p>The second important idea is that <code>update</code> and <code>draw</code> are separate.
Changing where something is and actually drawing it are two different events — you can do
the first without the second, and then nothing appears, which is a confusing afternoon the
first time it happens to you.</p>
`,

poke: `
<ol class="poke">
<li>In <span class="file">src/main.js</span>, find <code>duration: 1.2</code> in the Lenis
options. Change it to <code>3.5</code>. Scroll. The page now takes three and a half seconds
to coast to a stop and feels like it is underwater — proof that the "smoothness" is really
just a number saying how long the glide lasts.</li>
<li>Change it to <code>0.1</code>. The glide vanishes and you are back to a normal, hard
browser scroll. Somewhere around <code>1.0</code>–<code>1.4</code> is the range that reads
as expensive rather than broken. Put it back to <code>1.2</code>.</li>
<li>Open devtools → Ctrl+Shift+P → "Show frames per second (FPS) meter". Scroll the page
and watch the number. That counter <em>is</em> the flipbook speed.</li>
</ol>
`,

breaks: `
<ul>
<li><strong>Two loops instead of one.</strong> The classic version of this is calling
<code>lenis.raf()</code> from its own <code>requestAnimationFrame</code> while GSAP runs
its ticker separately. Both work, so nothing errors — you just get subtle jitter, because
two independent loops disagree about when "now" is. That is exactly why our Lenis is
attached to the GSAP ticker.</li>
<li><strong>Animating in the loop but never drawing.</strong> Values change every frame and
the screen never updates. Nothing throws. Log a value to confirm the loop is running before
you go hunting for a rendering bug.</li>
<li><strong>Work that piles up inside the tick.</strong> Anything expensive — measuring an
element's size, touching the DOM — happens sixty times a second here. It is the single
easiest place in a codebase to accidentally cost 40ms a frame.</li>
</ul>
`
},

{
title: "Why requestAnimationFrame and not setInterval",

kid: `
<p>Imagine you are painting a fence, and a photographer takes a picture of it every
sixteen seconds to show your progress. You want to paint in step with the photos.</p>
<p><strong>The bad way:</strong> you bring an egg timer set to sixteen seconds and paint
whenever it dings. Your timer and the photographer's schedule were never connected. They
drift. Sometimes you paint two strips between photos and the second one is never seen by
anybody. Sometimes you finish a strip a fraction of a second after the shutter clicks, so
that photo shows the fence half-done and the next one jumps.</p>
<p>Worse: when you go inside for lunch and nobody is even looking at the fence, your egg
timer keeps dinging and you keep painting, for no one.</p>
<p><strong>The good way:</strong> you ask the photographer to tap you on the shoulder just
before each shot. One tap, one strip, perfectly in step, and while you are at lunch there
are no photos, so there are no taps, and you rest.</p>
`,

why: `
<p>Every animation on this site is scheduled by the shoulder-tap, because the browser is
the only thing that actually knows when the screen is about to be redrawn.</p>
<p>The lunch break matters more than it sounds: when the visitor switches tabs, the taps
stop and the whole site goes quiet instead of grinding a phone battery in the background.</p>
`,

translation: `
<table>
<tr><td>The egg timer</td><td><code>setInterval(fn, 16)</code></td></tr>
<tr><td>The photographer tapping your shoulder</td><td><code>requestAnimationFrame(fn)</code></td></tr>
<tr><td>The camera clicking</td><td>the display's <strong>refresh</strong> / vsync</td></tr>
<tr><td>Painting a strip nobody photographs</td><td>a <strong>dropped</strong> or wasted frame</td></tr>
<tr><td>Going inside for lunch</td><td>the tab going to the background</td></tr>
</table>
<p>The tap also hands you something useful: the current time. <code>requestAnimationFrame</code>
passes a timestamp to your function, which is where the clock reading in the next page
comes from.</p>
`,

code: `
<pre><code><span class="c">// The egg timer. Fires on its own schedule, forever, even in a</span>
<span class="c">// background tab. 16ms is a guess at the refresh rate, and it is</span>
<span class="c">// wrong on any 120Hz phone or gaming monitor.</span>
setInterval(update, 16);

<span class="c">// The shoulder tap. Fires immediately before the next repaint,</span>
<span class="c">// at whatever rate this particular screen actually runs, and</span>
<span class="c">// pauses entirely when the tab is hidden.</span>
requestAnimationFrame(update);</code></pre>
<p>In <span class="file">src/main.js</span> we never call it directly, because GSAP's ticker
is already a well-behaved wrapper around it:</p>
<pre><code>gsap.ticker.add((time) =&gt; lenis.raf(time * 1000));
gsap.ticker.lagSmoothing(0);</code></pre>
<p>That second line is worth knowing. By default GSAP notices when a frame took far too
long — the laptop woke from sleep, say — and quietly pretends less time passed, so
animations don't teleport. Lenis is doing its own physics off real elapsed time, so we turn
the lie off and let both see the same clock.</p>
`,

tour: `
<p>There is only one idea here: <em>let the thing that owns the screen decide when you
draw.</em> Everything else follows from it — the correct rate on any display, no wasted
work, automatic pausing in background tabs.</p>
`,

poke: `
<ol class="poke">
<li>Load the site, then switch to another tab for ten seconds and come back. The animations
pick up where they were rather than having raced ahead. That is the lunch break.</li>
<li>In the console, run <code>gsap.ticker.fps(10)</code>. Everything drops to ten frames a
second — the same animations, the same durations, just far fewer pages in the flipbook.
<code>gsap.ticker.fps(60)</code> puts it back.</li>
<li>Run <code>gsap.globalTimeline.timeScale(0.15)</code> and scroll to trigger a reveal.
The whole site moves in slow motion, which is by far the best way to see what an easing
curve is actually doing. <code>timeScale(1)</code> restores it.</li>
</ol>
`,

breaks: `
<ul>
<li><strong>Assuming 60fps.</strong> Writing <code>x += 2</code> per frame gives double the
speed on a 120Hz screen and half on a struggling phone. The fix is the next page.</li>
<li><strong>Forgetting to cancel.</strong> A loop started for a component that later goes
away keeps running forever, holding everything it references in memory. Keep the id that
<code>requestAnimationFrame</code> returns and <code>cancelAnimationFrame</code> it.</li>
<li><strong>Stacking loops.</strong> Start the loop in a function that runs twice and you
now have two loops, each drawing every frame. Symptom: everything moves at exactly double
speed, which reads as "the easing is wrong" rather than "there are two loops".</li>
</ul>
`
},

{
title: "Lerp — the walk-half-way-there trick",

kid: `
<p>Stand across the room from a door. Every second, walk exactly <strong>one tenth</strong>
of whatever distance is still between you and it. Not a tenth of the original distance — a
tenth of what is <em>left</em>, measured fresh each time.</p>
<p>At first the gap is big, so a tenth of it is a big stride. As you close in, the gap
shrinks, so each step shrinks with it. You start fast and glide to an almost-stop, without
ever deciding to slow down. The slowing is automatic. It falls out of the rule.</p>
<p>Two things worth noticing. You never <em>quite</em> arrive, because there is always a
tenth of something left — but the gap gets so small that nobody could tell. And if somebody
picks up the door and moves it while you are walking, you don't have to recalculate a plan.
The next step is still just a tenth of whatever is left. It handles the interruption for
free.</p>
`,

why: `
<p>This is the entire reason the scroll on this site glides instead of jumping: there is a
real scroll position and a displayed one, and every frame the displayed one walks a fraction
of the way toward the real one.</p>
<p>It is also what a custom cursor will use in Sprint 3 — the cursor chases the pointer
rather than being pinned to it, which is the whole trick behind that slightly liquid feel.</p>
`,

translation: `
<table>
<tr><td>Where you are standing</td><td><code>current</code></td></tr>
<tr><td>The door</td><td><code>target</code></td></tr>
<tr><td>The one-tenth</td><td>the <strong>factor</strong> — how eagerly it chases, 0 to 1</td></tr>
<tr><td>The whole rule</td><td><strong>lerp</strong>, short for linear interpolation</td></tr>
<tr><td>Somebody moving the door</td><td>the target changing mid-animation</td></tr>
</table>
<p>The name is unhelpfully grand. "Interpolate" means "find a value in between", and
"linear" means "in a straight line". Lerp finds a point some fraction of the way from A to
B. That is all it is. The magic is not in the maths, it is in the fact that we <em>re-run
it every frame against a target that keeps changing.</em></p>
`,

code: `
<pre><code><span class="c">// The whole idea, in one line.</span>
<span class="c">// factor 0 = never move. 1 = teleport instantly.</span>
<span class="c">// 0.1 = cover a tenth of the remaining gap this frame.</span>
const lerp = (current, target, factor) =&gt;
  current + (target - current) * factor;

<span class="c">// (target - current) is "how far is left" — the gap.</span>
<span class="c">// Take a slice of the gap, add it to where we are. That's it.</span>

<span class="c">// Used every frame, chasing a target that changes:</span>
function tick() {
  requestAnimationFrame(tick);
  displayed = lerp(displayed, actualScroll, 0.1);
  render(displayed);
}</code></pre>
<p>Lenis is a careful, frame-rate-corrected version of exactly this, which is why its
config in <span class="file">src/main.js</span> reads as a duration rather than a factor —
it does the correction so we don't have to.</p>
`,

tour: `
<p>The one line that matters is <code>current + (target - current) * factor</code>. Read it
as three steps: <em>how far is left</em>, <em>take a slice of that</em>, <em>add it on</em>.</p>
<p>The line that makes it an animation rather than a calculation is the one running it every
frame with the result fed back in. Lerp used once is just a midpoint. Lerp used sixty times
a second on its own output is motion.</p>
`,

poke: `
<ol class="poke">
<li>Paste this into the console on the site:
<pre><code>let c = 0; const t = 100;
for (let i = 0; i &lt; 12; i++) { c = c + (t - c) * 0.1; console.log(i, c.toFixed(2)); }</code></pre>
Watch the steps: 10, then 9, then 8.1, then 7.29. Big strides shrinking on their own. That
column of numbers is the deceleration you feel when you scroll.</li>
<li>Change <code>0.1</code> to <code>0.5</code> and run it again — it arrives in about six
steps and would feel snappy and cheap. Change it to <code>0.02</code> and it barely moves,
which would feel unresponsive and broken.</li>
<li>In <span class="file">src/main.js</span>, set the Lenis <code>duration</code> to
<code>0.6</code> and scroll. That is a high factor: quick, tight, ordinary. The
site's calm depends on that number being roughly twice as big.</li>
</ol>
`,

breaks: `
<ul>
<li><strong>The frame-rate trap.</strong> A raw lerp of 0.1 per frame is twice as fast at
120fps as at 60fps, because it is applied twice as often. It is the same bug as
<code>x += 2</code>, wearing a nicer coat. Real libraries correct for elapsed time; hand-
rolled ones usually don't, and it only shows up on someone else's machine.</li>
<li><strong>Waiting for it to finish.</strong> It never arrives exactly. If something must
run "on arrival", check whether the gap is smaller than a threshold — never
<code>current === target</code>, which may be true only after a very long time, or never.</li>
<li><strong>Factors above 1.</strong> Overshoots past the target, then overshoots back,
growing each time. The symptom is something that vibrates violently instead of settling.</li>
</ul>
`
},

{
title: "Easing — why 1.4 seconds can feel cheap or expensive",

kid: `
<p>Two ways to be handed a glass of water.</p>
<p>A robot arm takes it from the table and puts it in your hand, moving at one exact speed
the whole way, starting instantly and stopping dead. It takes one second. It is deeply
unsettling to watch, and you cannot say why.</p>
<p>A person does the same thing in the same one second. But their hand doesn't start
instantly — it takes a moment to get going, moves quickest in the middle, and slows as it
arrives so the water doesn't slop. Same distance, same second, completely different feeling.</p>
<p>Nothing in the real world starts or stops instantly. Everything has to get going and has
to settle. When something on a screen moves at a dead constant speed, your eye reads it as
mechanical, and "mechanical" is one short step from "cheap".</p>
<p>So the interesting question was never <em>how long</em> the movement takes. It is
<em>how the speed is distributed</em> across that time. That distribution has a name and it
is the difference between a site that feels expensive and one that doesn't.</p>
`,

why: `
<p>CLAUDE.md asks for slow, confident motion in the 0.8–1.6 second range. Duration alone
won't get there — a slow linear animation just feels sluggish. What makes it read as
expensive is that almost all the movement happens early and then it takes its time
settling.</p>
<p>That is why the headline reveal uses <code>expo.out</code>: it covers most of the
distance almost immediately and spends the rest of the 1.4 seconds easing to a stop.</p>
`,

translation: `
<table>
<tr><td>The robot arm</td><td><code>linear</code> — no easing</td></tr>
<tr><td>Taking a moment to get going</td><td><strong>ease in</strong></td></tr>
<tr><td>Slowing down as it arrives</td><td><strong>ease out</strong></td></tr>
<tr><td>Both ends</td><td><strong>ease in-out</strong></td></tr>
<tr><td>How the speed is spread over the time</td><td>the <strong>easing curve</strong></td></tr>
<tr><td>The curve written as four numbers</td><td><code>cubic-bezier(x1, y1, x2, y2)</code></td></tr>
</table>
<p>The rule of thumb: <strong>things arriving get ease-out, things leaving get ease-in.</strong>
Something entering has already got your attention and needs to settle gracefully; something
leaving should get out of the way. Nearly all of this site is ease-out, because nearly all
of it is arriving.</p>
`,

code: `
<p>In <span class="file">src/main.js</span>, the headline:</p>
<pre><code>.from(split.lines, {
  yPercent: 115,      <span class="c">// just past 100 so no descender peeks out of the mask</span>
  duration: 1.4,      <span class="c">// slow end of the 0.8–1.6s band — first thing anyone sees</span>
  ease: "expo.out",   <span class="c">// most of the distance up front, long graceful settle</span>
  stagger: 0.09,      <span class="c">// each line starts 90ms after the one above it</span>
})</code></pre>
<p>And in <span class="file">src/style.css</span>, one curve for every CSS transition on
the site:</p>
<pre><code>--ease: cubic-bezier(0.16, 1, 0.3, 1);</code></pre>
<p>Those four numbers are the handles on a curve of distance against time. The second
number being <code>1</code> is what makes it an "out" — it says <em>be finished almost
immediately</em>, and the rest of the duration is spent creeping the last few percent.
Using one shared curve everywhere is a real design decision: it is what makes separate
animations feel like one system rather than a pile of parts.</p>
`,

tour: `
<p><code>ease</code> and <code>duration</code> are doing completely different jobs and it is
worth keeping them apart in your head. Duration is how long. Ease is the personality. You
can change either without touching the other, and the personality matters more.</p>
<p><code>stagger</code> is the third one, and it is cheap magic: 90 milliseconds between
lines is enough for the eye to read them as a sequence rather than a block, without ever
feeling like it is waiting.</p>
`,

poke: `
<ol class="poke">
<li>In <span class="file">src/main.js</span>, change the headline's <code>ease</code> to
<code>"none"</code> and reload. Same 1.4 seconds, and it now looks like a cheap slideshow
transition. This is the single most convincing demonstration in this whole file — change
nothing but the personality and the site stops feeling expensive.</li>
<li>Try <code>"back.out(1.7)"</code>. It overshoots and springs back. Playful, bouncy, and
completely wrong for this site — useful to see what we are deliberately not doing.</li>
<li>Change <code>stagger: 0.09</code> to <code>0.4</code>. The lines now arrive so far apart
that you notice yourself waiting. Then try <code>0</code> — they move as one slab and the
sequence is lost. Somewhere near 0.08–0.12 is where it reads as deliberate.</li>
<li>Open <a href="https://cubic-bezier.com" style="color:var(--signal)">cubic-bezier.com</a>
and paste in <code>0.16, 1, 0.3, 1</code>. Drag the handles and watch the little dot replay.
That dot is exactly what your eye is reading on the real site.</li>
</ol>
`,

breaks: `
<ul>
<li><strong>Ease-in on something arriving.</strong> It creeps out of nowhere and then rushes
at you — the most common way an animation feels "off" without anyone being able to name why.</li>
<li><strong>A different curve for every animation.</strong> Individually fine, collectively
incoherent. One curve, reused, is the whole reason a site reads as designed.</li>
<li><strong>Reaching for duration when the ease is the problem.</strong> If something feels
sluggish, making it slower with a good curve often fixes it and making it faster with a bad
one rarely does.</li>
<li><strong>Forgetting reduced motion.</strong> Every curve on this site is skipped entirely
when the visitor has asked their OS for less motion — see the top of
<span class="file">src/main.js</span>. Easing is decoration; the content is not.</li>
</ul>
`
},

whole.</p>

{
title: "What a shader actually is",

kid: `
<p>You have a wall to paint, and two million painters.</p>
<p>You give every single one of them the same instruction card. Not two million
different cards — one card, copied two million times. Then you tell each painter to stand
at their own spot on the wall, read the card, and paint the one dot in front of them. All
at the same instant.</p>
<p>Because the card has to work for every painter, it can't say "paint a blue circle". No
painter can see the wall, or the circle, or anybody else. The card can only give
instructions to <em>one</em> painter about <em>one</em> dot, and the only thing that makes
one painter different from another is where they happen to be standing.</p>
<p>So the card says things like: <em>"Look at where you are. Work out how far you are from
the middle. If that's less than a hand's width, paint pale grey. Otherwise paint almost
black."</em> Every painter follows it, each gets a different answer because each is standing
somewhere different, and a soft grey circle appears on the wall — without a single painter
knowing a circle was ever involved.</p>
<p>Two consequences fall straight out of this. It's astonishingly fast, because two million
dots get painted in the time one painter takes to read a card. And no painter can ask a
neighbour anything, or remember what they painted last time, or look at the finished wall —
they have no eyes and no memory. They have their position and the card. That's the whole
job.</p>
`,

why: `
<p>The entire background of this site is one card: the dark gradient, the glow that slides
away as you scroll, and the film grain over everything. It costs one rectangle and one
short file.</p>
<p>Doing the same thing in CSS or on a 2D canvas would mean layered blurred divs or a
per-pixel JavaScript loop, and both would visibly cost more than they are worth. This runs
on hardware built for exactly this shape of problem.</p>
`,

translation: `
<table>
<tr><td>The painters</td><td><strong>fragments</strong> — roughly, pixels</td></tr>
<tr><td>The instruction card</td><td>the <strong>fragment shader</strong></td></tr>
<tr><td>Where a painter is standing</td><td><code>gl_FragCoord</code> and <strong>UVs</strong></td></tr>
<tr><td>The colour they paint</td><td><code>gl_FragColor</code></td></tr>
<tr><td>All painting at once</td><td><strong>parallelism</strong> — why the GPU is fast</td></tr>
<tr><td>No eyes, no memory, no neighbours</td><td>fragments are <strong>independent</strong></td></tr>
<tr><td>The language on the card</td><td><strong>GLSL</strong></td></tr>
</table>
<p>"Fragment" rather than "pixel" because a fragment is a <em>candidate</em> pixel — in a
3D scene several fragments can compete for the same screen position and only one wins.
Ours is flat, so here they are the same thing.</p>
`,

code: `
<p>The final line of <span class="file">src/shaders/background.frag</span> is the whole
contract — one colour, from one painter:</p>
<pre><code>gl_FragColor = vec4(col, 1.0);   <span class="c">// red, green, blue, alpha — each 0.0 to 1.0</span></code></pre>
<p>And the line that makes each painter different is the first one in <code>main()</code>:</p>
<pre><code><span class="c">// Where am I? Centred on zero, and corrected so a circle is round.</span>
vec2 p = (gl_FragCoord.xy - 0.5 * uResolution) / uResolution.y;</code></pre>
<p>Everything between those two lines is arithmetic on <code>p</code>. Distance from a
point, softened, bent into a falloff, mixed between two colours. There is no drawing in a
shader — no "draw circle", no "fill rect". There is only: <em>given where I am, what
colour am I?</em></p>
<p>Colours are 0.0–1.0, not 0–255. Our background <code>#0B0B0C</code> is
<code>vec3(0.043, 0.043, 0.047)</code>, which is 11/255.</p>
`,

tour: `
<p>Read <span class="file">background.frag</span> top to bottom — it is short and it is in
order. The uniforms at the top are the values JavaScript hands in. <code>hash()</code> is
the grain's random generator. Inside <code>main()</code>: work out where I am, work out how
far I am from the glow, mix two colours by that amount, add a speckle, output.</p>
<p>The two lines actually worth your attention are the <code>p</code> line, because
everything else depends on it, and the <code>mix()</code> line, because that is where a
number becomes a colour.</p>
`,

poke: `
<ol class="poke">
<li>In <span class="file">src/shaders/background.frag</span>, find
<code>gl_FragColor = vec4(col, 1.0);</code> and change it to
<code>gl_FragColor = vec4(vUv, 0.0, 1.0);</code>. The screen becomes a red-green gradient.
You are now painting each pixel's own coordinates as a colour — the clearest possible proof
that every fragment knows only where it is. Change it back.</li>
<li>Find <code>glow = pow(glow, 2.4);</code> and change <code>2.4</code> to <code>1.0</code>.
The soft light becomes a flat, obvious disc. That one exponent is the difference between
"there is a light source" and "there is a grey circle".</li>
<li>Change <code>const vec3 LIFT</code> to <code>vec3(0.9, 0.2, 0.1)</code>. The glow turns
hot orange and the whole page instantly looks like a different website. Undo it — but note
how little had to change.</li>
</ol>
`,

breaks: `
<ul>
<li><strong>Pure black screen, no error on the page.</strong> Almost always a shader that
failed to compile. Open the console: WebGL prints the GLSL error with a line number, and it
is usually the next item on this list.</li>
<li><strong>Integers where floats belong.</strong> GLSL will not quietly convert.
<code>pow(glow, 2)</code> is an error; it must be <code>2.0</code>. Likewise
<code>vec3(0)</code> should be <code>vec3(0.0)</code>. This is the single most common
beginner error and the message is not always obvious.</li>
<li><strong>Expecting to debug it.</strong> There is no <code>console.log</code> in a
shader, no breakpoints, no stepping. The way you inspect a value is to paint it:
<code>gl_FragColor = vec4(vec3(myValue), 1.0);</code> and look at the resulting greyscale.
That is genuinely the standard technique, not a hack.</li>
</ul>
`
},

{
title: "Vertex vs fragment, and what UVs are",

kid: `
<p>Hanging a bedsheet on a wall takes two completely different jobs.</p>
<p><strong>Job one</strong> is four people holding the four corners, deciding where each
corner goes. That's it — four decisions, done once. Nobody is looking at the pattern on the
sheet; they are just holding corners.</p>
<p><strong>Job two</strong> is what the sheet actually looks like, at every point across
it. That's the two million painters from the last page.</p>
<p>Now the useful bit. Suppose the corner-holders each write a number on their corner:
bottom-left writes 0, top-right writes 1. Anyone standing anywhere on the sheet can now work
out their own number by seeing how far they are between the corners — a quarter of the way
across is 0.25, halfway is 0.5. Nobody had to tell them. It falls out of the corners
automatically.</p>
<p>That's the trick that makes the whole thing work: <em>a handful of values decided at the
corners, smoothly filled in everywhere between.</em> Four decisions become two million,
free.</p>
`,

why: `
<p>Our background is exactly this bedsheet: four corners that never move, and a fragment
shader doing all the real work across them. That's why
<span class="file">background.vert</span> is nine lines and does nothing interesting.</p>
<p>The blending is what makes the gradient smooth. Nothing computes "the gradient" — each
pixel independently computes its own spot on it.</p>
`,

translation: `
<table>
<tr><td>The people holding corners</td><td>the <strong>vertex shader</strong>, run once per corner</td></tr>
<tr><td>A corner</td><td>a <strong>vertex</strong></td></tr>
<tr><td>The painters across the sheet</td><td>the <strong>fragment shader</strong>, run per pixel</td></tr>
<tr><td>The number written on each corner</td><td>a <strong>varying</strong></td></tr>
<tr><td>Filling in the values between corners</td><td><strong>interpolation</strong></td></tr>
<tr><td>"How far across the sheet am I", 0 to 1</td><td><strong>UV coordinates</strong></td></tr>
</table>
<p>UVs are just called that because x, y and z were already taken by 3D positions, so the
letters u and v got the job of naming positions on a surface. A UV of (0,0) is one corner,
(1,1) is the opposite one, and the numbers stay 0–1 whether the thing is displayed at 300
pixels wide or 3000.</p>
<p><strong>Vertex runs a handful of times. Fragment runs millions of times.</strong> Any
work you can move up to the vertex shader is nearly free by comparison. Our rectangle has
four vertices and roughly two million fragments — a ratio of half a million to one.</p>
`,

code: `
<p>The entire useful content of <span class="file">src/shaders/background.vert</span>:</p>
<pre><code>varying vec2 vUv;   <span class="c">// declared in BOTH files, same name, same type</span>

void main() {
  vUv = uv;         <span class="c">// uv is handed to us by Three.js, per corner</span>
  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
}</code></pre>
<p>And in <span class="file">background.frag</span>, the matching declaration:</p>
<pre><code>varying vec2 vUv;   <span class="c">// arrives already blended for this exact pixel</span></code></pre>
<p>Write it at four corners, read it at two million pixels, and the GPU does the filling-in
in dedicated hardware. The <code>v</code> prefix is a convention meaning "this is a
varying", and it is worth keeping — in a bigger shader it is the fastest way to know where
a value came from.</p>
<p>Our fragment shader mostly uses <code>gl_FragCoord</code> instead, which is the pixel's
position in actual screen pixels rather than 0–1 across the sheet. For a full-screen effect
that needs to know the real aspect ratio, screen pixels are the more direct question to ask.</p>
`,

tour: `
<p>Open both shader files side by side and look only at the <code>varying vec2 vUv;</code>
line in each. That one duplicated declaration is the entire pipe between the two stages. If
the names or types don't match exactly, the link fails — and the error message points at
the shader, not at the mismatch.</p>
`,

poke: `
<ol class="poke">
<li>In <span class="file">background.frag</span>, temporarily set
<code>gl_FragColor = vec4(vUv.x, 0.0, 0.0, 1.0);</code>. Black on the left, red on the
right — you are looking directly at interpolation doing its job. Try <code>vUv.y</code> for
the vertical version.</li>
<li>In <span class="file">background.vert</span>, change <code>vUv = uv;</code> to
<code>vUv = uv * 3.0;</code>, with the debug line above still in place. The gradient now
runs 0→3 across the sheet, so it hits full red a third of the way over and stays there.
Multiplying UVs is how tiling and repetition are done.</li>
<li>In <span class="file">background.frag</span>, find the <code>p</code> line and remove
the aspect correction — divide by <code>uResolution</code> instead of
<code>uResolution.y</code>. The glow squashes into an oval on a wide window. That single
<code>.y</code> is the whole fix.</li>
</ol>
`,

breaks: `
<ul>
<li><strong>Mismatched varyings.</strong> Declared <code>vec2</code> in one file and
<code>vec3</code> in the other, or spelled differently — the program fails to link and you
get a black screen with a message about the shader rather than about the mismatch.</li>
<li><strong>Expecting UVs in pixels.</strong> They are 0–1, always. If you want pixels, use
<code>gl_FragCoord</code> or multiply the UVs by the resolution yourself.</li>
<li><strong>Doing fragment work in the fragment shader that could be done at the
vertices.</strong> Not wrong, just expensive — you are paying half a million times over for
a result that would have blended perfectly well.</li>
</ul>
`
},

{
title: "Uniforms — the only way to talk to the GPU",

kid: `
<p>Back to the two million painters, all holding the same card. The card is printed. You
cannot hand out two million new cards every time something changes.</p>
<p>But you do need to tell them things. The clock has ticked. The visitor has scrolled
halfway down. The wall is a different size than it was.</p>
<p>So above the painters there is a small noticeboard that every single one of them can see
from where they stand. You can change what's pinned to it whenever you like. The card can
say <em>"read the time off the noticeboard and use it"</em>, and all two million read the
same value at the same instant.</p>
<p>Two rules about the noticeboard, and they matter. It is <strong>read-only</strong> for
the painters — they can look, never write. And it is <strong>the same for everybody</strong>:
it can't say a different thing to the painter in the corner than to the one in the middle.
That's exactly what makes it safe for two million to read at once with nobody queueing.</p>
`,

why: `
<p>Without uniforms our background would be a still image. The gradient breathes because
<code>uTime</code> is repinned every frame, and it slides as you scroll because
<code>uScroll</code> is repinned on every scroll event.</p>
<p>This is also the seam between the two halves of the project: JavaScript knows about
scrolling and the DOM, the shader knows about pixels, and uniforms are the only place they
meet.</p>
`,

translation: `
<table>
<tr><td>The noticeboard</td><td><strong>uniforms</strong></td></tr>
<tr><td>Same value for every painter</td><td>"uniform" — that is literally why it is called that</td></tr>
<tr><td>Read-only for the painters</td><td>a shader cannot write to a uniform</td></tr>
<tr><td>Pinning up a new value</td><td><code>uniforms.uTime.value = elapsed</code></td></tr>
<tr><td>What each painter works out alone</td><td>a local <code>vec3</code>, gone at the end of the pixel</td></tr>
</table>
<p>Worth holding onto the three-way distinction: an <strong>attribute</strong> differs per
vertex, a <strong>varying</strong> is passed from vertex to fragment and blended on the way,
and a <strong>uniform</strong> is the same for everything in the whole draw.</p>
`,

code: `
<p>Declared in <span class="file">src/webgl/Stage.js</span> — this object is the JavaScript
side of the noticeboard, and it is handed to the material once:</p>
<pre><code>this.uniforms = {
  uTime:          { value: 0 },
  uScroll:        { value: 0 },
  uResolution:    { value: new Vector2(w, h) },
  uGrainStrength: { value: this.quality.grain },
};</code></pre>
<p>Matched at the top of <span class="file">background.frag</span> by name and type:</p>
<pre><code>uniform float uTime;
uniform float uScroll;
uniform vec2  uResolution;
uniform float uGrainStrength;</code></pre>
<p>Updated in the loop, and on scroll:</p>
<pre><code>this.uniforms.uTime.value = elapsed;             <span class="c">// in Stage.js, every frame</span>

lenis.on("scroll", ({ progress }) =&gt; stage?.setScroll(progress));  <span class="c">// in main.js</span></code></pre>
<p>Notice what crosses that boundary: one number between 0 and 1. The shader has no idea
how tall the page is, what Lenis is, or that a DOM exists. Keeping the seam that narrow is
why the shader stayed simple.</p>
`,

tour: `
<p>You are mutating <code>.value</code>, not replacing the uniform object. Three.js holds a
reference to that object and uploads whatever it finds inside it each frame — assign a
whole new object over the top and the link is broken, silently.</p>
<p>The <code>u</code> prefix is a convention, and CLAUDE.md asks for descriptive names for
good reason: <code>uDistortionStrength</code> tells you what a number does six weeks later,
<code>u1</code> does not.</p>
`,

poke: `
<ol class="poke">
<li>With the site running, open the console and type
<code>stage.uniforms.uScroll.value = 1.0</code>. The glow jumps to where it would be at the
bottom of the page, without scrolling. You are pinning something to the noticeboard by
hand.</li>
<li>Try <code>stage.uniforms.uGrainStrength.value = 0.5</code>. The page turns to heavy
television static. Then <code>0</code> — and look closely at the gradient: you should see
faint stripes where the colour steps. That banding is what the grain exists to hide.</li>
<li>In <span class="file">background.frag</span>, find
<code>sin(uTime * 0.06) * 0.05</code> and change it to
<code>sin(uTime * 0.9) * 0.35</code>. The background now visibly pulses and looks cheap.
The original numbers are deliberately just above "is that even moving?" — that restraint is
the difference between calm and busy.</li>
</ol>
`,

breaks: `
<ul>
<li><strong>Declared but never used.</strong> GLSL compilers strip out any uniform the code
does not actually reference, so setting it from JavaScript appears to do nothing. If a
uniform seems ignored, first check the shader really uses it.</li>
<li><strong>Type mismatch.</strong> A <code>float</code> uniform fed a <code>Vector2</code>,
or the reverse. Sometimes silent, sometimes a black screen.</li>
<li><strong>Forgetting to update on resize.</strong> <code>uResolution</code> has to be
re-set whenever the canvas changes size, or every aspect-ratio calculation downstream is
wrong — see the resize handler in <span class="file">Stage.js</span>.</li>
<li><strong>Replacing the uniforms object.</strong> <code>material.uniforms = {...}</code>
after the material is built breaks the reference Three is holding. Always write to
<code>.value</code>.</li>
</ul>
`
},

{
title: "Noise, grain, and why there is no random()",

kid: `
<p>Ask two million painters to each pick a random colour and you have a problem: none of
them can talk to each other, none of them remembers anything, and every one of them would
have to be handed their own dice. Randomness needs memory — a place to keep "what did I roll
last time" — and these painters have none.</p>
<p>So you cheat, with a rule that <em>looks</em> random but isn't.</p>
<p>Imagine a rule like: <em>take the numbers of the row and column you're standing on,
multiply them by two very awkward numbers, and keep only the digits after the decimal
point.</em> Standing at row 12, column 7 always gives the same answer, every time, for
anyone. It's completely predictable. But move one step sideways and the awkward
multiplication throws the answer somewhere else entirely — so laid out across the wall, the
values scatter with no visible pattern.</p>
<p>That's the trick. Not random at all — just a rule so twitchy that neighbouring positions
land on unrelated results. Add a pinch of the current time to what you feed it, and the
whole speckle reshuffles every frame.</p>
`,

why: `
<p>Grain does two jobs here. It unifies the page the way film grain unifies a photograph —
it is the cheapest way to stop a flat dark background looking like an empty CSS div.</p>
<p>And it fixes a real technical problem. Screens store 256 levels per colour channel. A
gradient this dark and this gradual doesn't have enough of them, so it shows visible
stripes. Scattering each pixel slightly breaks the stripes into texture your eye reads as
smooth.</p>
`,

translation: `
<table>
<tr><td>The twitchy rule</td><td>a <strong>hash</strong> function</td></tr>
<tr><td>Looks random, is repeatable</td><td><strong>deterministic</strong> / pseudo-random</td></tr>
<tr><td>Keeping the digits after the point</td><td><code>fract()</code></td></tr>
<tr><td>The awkward numbers</td><td>hash constants — folklore, tuned by eye</td></tr>
<tr><td>Visible stripes in a gradient</td><td><strong>banding</strong></td></tr>
<tr><td>Scattering pixels to hide stripes</td><td><strong>dithering</strong></td></tr>
</table>
<p>This kind — every pixel independent, pure static — is <strong>white noise</strong>. There
is a smoother family called <strong>value</strong> or <strong>Perlin</strong> noise, which
blends between random values on a grid to make clouds, smoke and terrain. Same principle,
more arithmetic. Film grain wants the cheap kind.</p>
`,

code: `
<p>From <span class="file">src/shaders/background.frag</span>:</p>
<pre><code><span class="c">// Give it a position, get back a repeatable 0–1 that looks random.</span>
<span class="c">// The constants are folklore — chosen so neighbouring pixels land</span>
<span class="c">// on wildly different results.</span>
float hash(vec2 p) {
    p = fract(p * vec2(123.34, 456.21));
    p += dot(p, p + 45.32);
    return fract(p.x * p.y);
}</code></pre>
<pre><code><span class="c">// fract(uTime * 60.0) reshuffles the pattern every frame. Feeding raw</span>
<span class="c">// uTime would make it drift smoothly — which reads as crawling insects</span>
<span class="c">// rather than grain.</span>
float grain = hash(gl_FragCoord.xy + fract(uTime * 60.0) * 100.0);
col += (grain - 0.5) * uGrainStrength;</code></pre>
<p>The <code>- 0.5</code> matters. <code>hash</code> returns 0 to 1, so subtracting a half
gives −0.5 to +0.5: as many pixels darkened as brightened, and the average brightness of the
page is unchanged. Without it the grain would wash the whole background lighter.</p>
`,

tour: `
<p>Three lines, three jobs. <code>hash()</code> makes the speckle.
<code>fract(uTime * 60.0)</code> makes it move. <code>(grain - 0.5) * uGrainStrength</code>
centres it on zero and scales it down to something you feel rather than see.</p>
<p>The strength is set per device in <span class="file">Stage.js</span> —
<code>0.075</code> normally, <code>0.055</code> on a weak one, where the shader is already
running at half rate and heavy grain would strobe.</p>
`,

poke: `
<ol class="poke">

<p>Two people are describing seats in the same cinema, and each has brought their own way of

<tr><td>Reading a seat number off the plan</td><td><code>getBoundingClientRect()</code></td></tr>
<tr><td>Move the corner to the middle</td><td>subtract half the viewport</td></tr>
<tr><td>Flip which way is down</td><td>negate y</td></tr>

<p>The one decision that makes all of this easy: our orthographic camera is measured

const pageEl = document.getElementById("page");
const tocEl = document.getElementById("toc");
const counterEl = document.getElementById("counter");
const prevBtn = document.getElementById("prev");
const nextBtn = document.getElementById("next");

let index = 0;

function buildToc() {
    tocEl.innerHTML =
        "<ol>" +
        PAGES.map((p, i) => `<li><button data-i="${i}">${p.title}</button></li>`).join("") +
        "</ol>";
    tocEl.querySelectorAll("button").forEach((b) =>
        b.addEventListener("click", () => go(Number(b.dataset.i)))
    );
}

function render() {
    const page = PAGES[index];

    pageEl.innerHTML =
        `<h2 class="page-title">${page.title}</h2>` +
        SECTIONS.filter(([, key]) => page[key])
            .map(([label, key, cls]) => `<h3>${label}</h3><div class="${cls}">${page[key]}</div>`)
            .join("");

    counterEl.textContent = `${index + 1} / ${PAGES.length}`;
    prevBtn.disabled = index === 0;
    nextBtn.disabled = index === PAGES.length - 1;

    tocEl.querySelectorAll("button").forEach((b, i) =>
        b.classList.toggle("current", i === index)
    );

    location.hash = String(index + 1);
}

function go(i) {
    index = Math.max(0, Math.min(PAGES.length - 1, i));
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
}

prevBtn.addEventListener("click", () => go(index - 1));
nextBtn.addEventListener("click", () => go(index + 1));

document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft") go(index - 1);
    if (e.key === "ArrowRight") go(index + 1);
});

// Deep-link support: LEARNING.html#3 opens page 3.
const fromHash = parseInt(location.hash.slice(1), 10);
if (fromHash >= 1 && fromHash <= PAGES.length) index = fromHash - 1;

buildToc();
render();
</script>
</body>
</html>
