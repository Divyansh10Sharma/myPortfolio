<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- ── SEO Meta Tags ──────────────────────────────── -->
        <title>Divyansh Sharma | Full Stack Engineer</title>
        <meta name="description" content="Full Stack Engineer specializing in React, React Native, Flask, and Firebase. Building production systems in healthtech — AI, mobile & SaaS." />
        <meta name="keywords" content="Full Stack Engineer, React, React Native, Flask, Firebase, Portfolio, Delhi, Divyansh Sharma" />
        <meta name="author" content="Divyansh Sharma" />
        <meta name="robots" content="index, follow" />

        <!-- ── Open Graph (LinkedIn, Slack previews) ─────── -->
        <meta property="og:title" content="Divyansh Sharma | Full Stack Engineer" />
        <meta property="og:description" content="Building production systems in healthtech — AI nutrition engines, gym SaaS, and mobile apps reaching 5K+ users." />
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://divyansh-portfolio.vercel.app" />

        <!-- ── Twitter Card ───────────────────────────────── -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Divyansh Sharma | Full Stack Engineer" />
        <meta name="twitter:description" content="Building production systems in healthtech — AI, mobile & SaaS." />

        <!-- ── Favicon ────────────────────────────────────── -->
        <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%23915eff'/><stop offset='100%25' stop-color='%2300d4ff'/></linearGradient></defs><circle cx='50' cy='50' r='45' fill='url(%23g)'/><text y='.9em' font-size='55' x='15' font-family='monospace' font-weight='bold' fill='white'>D</text></svg>" />

        <!-- ── Google Fonts ───────────────────────────────── -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap"
            rel="stylesheet"
        />

        <!-- ── Base styles to prevent flash ──────────────── -->
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            html, body { background-color: #050816; color: #f3f4f6; overflow-x: hidden; }
            /* Prevent FOUC (flash of unstyled content) */
            body { opacity: 0; transition: opacity 0.3s ease; }
            body.loaded { opacity: 1; }
        </style>
    </head>
    <body>
        <div id="root"></div>

        <!-- Remove FOUC class after load -->
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                document.body.classList.add('loaded');
            });
        </script>
    </body>
</html>
