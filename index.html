<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#0B0B0C" />

        <title>Divyansh Sharma — Backend &amp; AI Engineer</title>
        <meta
            name="description"
            content="Backend and AI engineer building production systems in healthtech: AI features, a hand-written asyncio WebSocket layer, native health-sensor integration, and an in-flight Firestore-to-PostgreSQL migration."
        />
        <meta name="author" content="Divyansh Sharma" />
        <meta name="robots" content="index, follow" />
        <link rel="canonical" href="__SITE_URL__/" />

        <!-- __SITE_URL__ is substituted at build time from Vercel's deployment
             env (see vite.config.ts); the tag is dropped on local builds. -->
        <meta property="og:type" content="website" />
        <meta property="og:url" content="__SITE_URL__/" />
        <meta property="og:site_name" content="Divyansh Sharma" />
        <meta property="og:title" content="Divyansh Sharma — Backend &amp; AI Engineer" />
        <meta
            property="og:description"
            content="Backend and AI engineer building production systems in healthtech: AI features, a hand-written asyncio WebSocket layer, native health-sensor integration, and an in-flight Firestore-to-PostgreSQL migration."
        />
        <meta property="og:image" content="__SITE_URL__/og.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta
            property="og:image:alt"
            content="Divyansh Sharma, Backend and AI Engineer — with a step-reconciliation telemetry plot."
        />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Divyansh Sharma — Backend &amp; AI Engineer" />
        <meta
            name="twitter:description"
            content="Backend and AI engineer building production systems in healthtech."
        />
        <meta name="twitter:image" content="__SITE_URL__/og.png" />

        <link
            rel="icon"
            type="image/svg+xml"
            href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='2' fill='%230B0B0C'/%3E%3Cpath d='M4 23 L11 10 L11 23 L18 10 L18 23 L25 10' fill='none' stroke='%23E9EBED' stroke-width='2.5' stroke-linejoin='miter'/%3E%3C/svg%3E"
        />

        <!-- Critical CSS, inlined deliberately.

             The stylesheet is render-blocking and, in a React build, so is the
             bundle: nothing appears until React has parsed, mounted and
             painted. The static preloader below is styled from here so the
             first frame is a designed loading state rather than a blank page. -->
        <style>
            html,
            body {
                margin: 0;
                background: #0b0b0c;
                color: #e9ebed;
            }
            .preloader {
                position: fixed;
                inset: 0;
                z-index: 200;
                background: #0b0b0c;
                display: flex;
                flex-direction: column;
                justify-content: flex-end;
                padding: clamp(1.25rem, 5vw, 6rem);
                font-family: ui-monospace, "IBM Plex Mono", monospace;
            }
            .preloader__name {
                position: absolute;
                top: clamp(1.25rem, 5vw, 6rem);
                left: clamp(1.25rem, 5vw, 6rem);
                margin: 0;
                font-size: 0.8125rem;
                color: #8a929e;
            }
            .preloader__count {
                margin: 0 0 1.25rem;
                font-variant-numeric: tabular-nums;
                font-size: clamp(3rem, 12vw, 9rem);
                line-height: 1;
                letter-spacing: -0.04em;
            }
            .preloader__bar {
                height: 1px;
                background: #23252a;
            }
            .preloader__bar span {
                display: block;
                height: 100%;
                background: #e9ebed;
                transform: scaleX(0);
                transform-origin: left center;
            }
        </style>
    </head>
    <body>
        <!-- React replaces everything inside #root on mount. The markup here is
             the same preloader React is about to render, so the handover is
             invisible — but it paints on the very first frame, long before the
             bundle has finished parsing. -->
        <div id="root">
            <div class="preloader">
                <p class="preloader__name">Divyansh Sharma</p>
                <p class="preloader__count">000</p>
                <div class="preloader__bar"><span></span></div>
            </div>
        </div>

        <noscript>
            <p style="padding: 2rem; font-family: system-ui">
                This site is rendered with JavaScript and needs it enabled. The
                previous version, which does not, is preserved on the
                <code>v1-spec-sheet</code> branch of the repository.
            </p>
        </noscript>

        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
